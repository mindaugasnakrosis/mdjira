stories:
  - id: AHB
    epic: COST_Q1
    summary: "Enable Azure Hybrid Benefit on production Windows VMs"
    priority: Highest
    labels: [cost-optimization, azure, windows, licensing]
    description: |
      5 production VMs run Windows Server without Hybrid Benefit. Enabling it,
      assuming qualifying licenses are available, eliminates roughly $1,200-1,500/month
      of VM license cost (the largest single saving identified in the Q1 review).

      **Acceptance criteria**
      - Eligible Windows Server licenses with Software Assurance are inventoried and confirmed
      - All 5 production Windows VMs have --license-type Windows_Server applied
      - Next month's cost report shows VM Licenses line reduced by at least $1,200

      **Source**: examples/cost-review.md#1
    subtasks:
      - id: AHB-INV
        summary: "Inventory eligible Windows Server licenses with Software Assurance"
        description: "Confirm with IT procurement that Software Assurance is active and covers production VMs."
      - id: AHB-RUN
        summary: "Apply --license-type Windows_Server to each eligible production VM"
        description: "Run az vm update on the 5 confirmed VMs and verify the licensing flag in the Azure Portal."

  - id: RES
    epic: COST_Q1
    summary: "Exchange wasted VM reservations (D2s_v3, D4s_v3, B4ms)"
    priority: High
    labels: [cost-optimization, azure, reservations]
    description: |
      Three reserved VM SKUs (D2s_v3 ×2, D4s_v3 ×2, B4ms ×1) have no matching
      running instances and are paid waste. Exchange via the Azure Portal
      Reservations blade.

      **Acceptance criteria**
      - All three wasted reservations are exchanged or scoped to active SKUs
      - Following month's reservation payment line drops by ~$300

      **Source**: examples/cost-review.md#2

  - id: SQL
    epic: COST_Q1
    summary: "Right-size UAT SQL databases to match QA"
    priority: Medium
    labels: [cost-optimization, sql, right-sizing]
    description: |
      UAT SQL databases run at 4× QA capacity (200 DTU vs 50 DTU) with no
      observed usage justifying the difference. Downsize to match QA.

      **Acceptance criteria**
      - UAT SQL databases reconfigured at 50 DTU
      - 7-day post-change monitoring shows no DTU saturation
      - SQL Database line on cost report drops by ~$280/month

      **Source**: examples/cost-review.md#3

